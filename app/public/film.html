<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Runway — Film</title>
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<!--
  Runway launch film — proof of style (scenes 1–2, ~20 s). A frame-timed composition on a 1920×1080 stage,
  scaled to the window. Space / click: play from the start · R: restart · M: sound on/off · F: full screen.
  The soundtrack is synthesised here (Web Audio), so it's original: a drone, a notification tone, and an
  impact + pulse at the reveal. Swap in a licensed track in the edit if you prefer.
-->
<style>
  :root { --coral: #ff6b5e; --green: #46d483; --text2: #a7b0b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font-family: 'Barlow', system-ui, sans-serif; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #000; }
  canvas#dust { position: absolute; inset: 0; }
  .glow { position: absolute; inset: -20%; opacity: 0; pointer-events: none;
    background:
      radial-gradient(40% 45% at 72% 30%, rgba(163,40,111,.55), transparent 70%),
      radial-gradient(42% 50% at 22% 78%, rgba(44,86,168,.6), transparent 70%),
      radial-gradient(30% 35% at 52% 52%, rgba(91,58,160,.45), transparent 70%); }
  .line { position: absolute; left: 0; width: 100%; text-align: center; font-weight: 600; letter-spacing: -0.02em; will-change: transform, opacity, filter; opacity: 0; }
  .big { font-size: 128px; line-height: 1; }
  .mid { font-size: 64px; line-height: 1.1; font-weight: 500; color: #e9edf0; }
  .coral { color: var(--coral); }
  .note { position: absolute; left: 50%; top: 120px; width: 620px; margin-left: -310px; border-radius: 28px; padding: 22px 26px; opacity: 0;
    background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); box-shadow: 0 30px 80px rgba(0,0,0,.6);
    display: grid; grid-template-columns: 52px 1fr; gap: 16px; align-items: center; }
  .note .ic { width: 52px; height: 52px; border-radius: 14px; background: #1b2024; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #a7b0b8; }
  .note b { display: flex; justify-content: space-between; font-size: 20px; font-weight: 600; color: #fff; }
  .note b span { font-weight: 400; color: rgba(255,255,255,.6); font-size: 18px; }
  .note p { margin: 4px 0 0; font-size: 22px; color: rgba(255,255,255,.88); }
  svg#curve { position: absolute; inset: 0; overflow: visible; }
  .panel { position: absolute; border-radius: 36px; opacity: 0; border: 1px solid rgba(255,255,255,.14);
    background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.02)); backdrop-filter: blur(10px); }
  .mark { position: absolute; left: 0; width: 100%; top: 190px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; opacity: 0; }
  .badge { border-radius: 40px; overflow: hidden; box-shadow: 0 40px 120px rgba(105,32,85,.45), 0 0 0 1px rgba(255,255,255,.14); line-height: 0; }
  .mark .word { font-family: 'Barlow Condensed'; font-weight: 600; font-size: 120px; letter-spacing: .32em; margin-right: -.32em; }
  .tag { top: 760px; font-size: 58px; font-weight: 500; color: #e9edf0; }
  .hud { position: fixed; right: 16px; bottom: 12px; font-size: 13px; color: #555; z-index: 9; font-family: 'Barlow'; }
  .start { position: fixed; inset: 0; display: grid; place-items: center; z-index: 8; background: #000; cursor: pointer; }
  .start div { text-align: center; color: #8a939b; font-size: 18px; line-height: 1.8; }
  .start b { color: #fff; font-size: 26px; font-weight: 600; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow" id="glow"></div>
  <canvas id="dust" width="1920" height="1080"></canvas>

  <div class="line big" id="l1" style="top:330px">Payday is Friday.</div>
  <div class="line big" id="l2" style="top:330px">Rent is due <span class="coral">Thursday.</span></div>
  <div class="note" id="note"><div class="ic">BANK</div><div><b>Low balance alert <span>Thu 9:02 AM</span></b><p>Your balance may fall below what you keep.</p></div></div>
  <div class="line mid" id="l3" style="top:150px">One day shouldn’t change everything.</div>

  <div class="panel" id="p1" style="left:180px;top:140px;width:520px;height:340px"></div>
  <div class="panel" id="p2" style="left:1240px;top:600px;width:560px;height:360px"></div>
  <div class="panel" id="p3" style="left:1320px;top:120px;width:380px;height:260px"></div>
  <div class="panel" id="p4" style="left:140px;top:640px;width:400px;height:300px"></div>

  <svg id="curve" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <clipPath id="above"><rect x="-4000" y="-4000" width="9000" height="4720" /></clipPath>
      <clipPath id="below"><rect x="-4000" y="720" width="9000" height="4000" /></clipPath>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" /></filter>
      <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#46d483" /><stop offset="1" stop-color="#9dffc9" /></linearGradient>
    </defs>
    <g id="cam">
      <line id="cushion" x1="120" y1="720" x2="1800" y2="720" stroke="#f5b83d" stroke-width="2" stroke-dasharray="10 14" opacity="0" />
      <text id="cushionLab" x="130" y="704" fill="#f5b83d" font-family="Barlow" font-size="22" opacity="0">What you keep</text>
      <!-- the fall: white above the cushion, coral below it -->
      <g id="fall">
        <path id="fallW" d="M120 420 C 420 440, 640 500, 860 560 S 1080 650, 1150 860" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" clip-path="url(#above)" />
        <path id="fallR" d="M120 420 C 420 440, 640 500, 860 560 S 1080 650, 1150 860" fill="none" stroke="#ff6b5e" stroke-width="7" stroke-linecap="round" clip-path="url(#below)" />
        <path id="fallRglow" d="M120 420 C 420 440, 640 500, 860 560 S 1080 650, 1150 860" fill="none" stroke="#ff6b5e" stroke-width="16" stroke-linecap="round" clip-path="url(#below)" filter="url(#soft)" opacity=".7" />
      </g>
      <!-- the recovery -->
      <path id="riseGlow" d="M1150 860 C 1190 900, 1240 700, 1300 520 S 1520 160, 1820 90" fill="none" stroke="#46d483" stroke-width="22" stroke-linecap="round" filter="url(#soft)" opacity=".8" />
      <path id="riseP" d="M1150 860 C 1190 900, 1240 700, 1300 520 S 1520 160, 1820 90" fill="none" stroke="url(#rise)" stroke-width="8" stroke-linecap="round" />
      <circle id="tip" r="11" fill="#fff" opacity="0" />
    </g>
  </svg>

  <div class="mark" id="mark">
    <div class="badge">
      <svg viewBox="0 0 340 160" width="476" height="224" aria-label="Runway logo">
        <defs>
          <linearGradient id="Lbg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#12366d"/><stop offset=".5" stop-color="#20112e"/><stop offset="1" stop-color="#692055"/></linearGradient>
          <linearGradient id="Lline"><stop stop-color="#fff"/><stop offset=".54" stop-color="#fb625b"/><stop offset=".75" stop-color="#fb625b"/><stop offset=".76" stop-color="#42e1a1"/></linearGradient>
          <filter id="Lglow"><feGaussianBlur stdDeviation="4"/></filter>
        </defs>
        <rect width="340" height="160" fill="url(#Lbg)"/>
        <path id="logoGlow" d="M15 50 C75 48 67 86 135 82 S180 142 223 130 S238 53 276 56 S320 66 338 40" fill="none" stroke="#bd91ed" opacity=".4" stroke-width="11" filter="url(#Lglow)"/>
        <path id="logoLine" d="M15 50 C75 48 67 86 135 82 S180 142 223 130 S238 53 276 56 S320 66 338 40" fill="none" stroke="url(#Lline)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M0 118 H340" stroke="#d3badf" stroke-width="1" stroke-dasharray="3 5" opacity=".3"/>
        <circle id="logoDot" cx="217" cy="131" r="5" fill="#fc615c" opacity="0"/>
      </svg>
    </div>
    <div class="word" id="word">RUNWAY</div>
  </div>
  <div class="line tag" id="tag">See the dip before it happens.</div>
</div>
<div class="start" id="start"><div><b>Runway — proof of style</b>Click or press Space to play with sound · R restart · M mute · F full screen</div></div>
<div class="hud" id="hud"></div>

<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'scale(' + k + ') translate(-50%, -50%)'; stage.style.left = '50%'; stage.style.top = '50%'; stage.style.transform = 'translate(-50%,-50%) scale(' + k + ')'; stage.style.transformOrigin = '50% 50%'; stage.style.marginLeft = '0'; }
  addEventListener('resize', fit); fit();

  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (x) { return Math.max(0, Math.min(1, x)); };
  var ease = function (x) { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }; // easeInOutCubic
  var out = function (x) { x = clamp(x); return 1 - Math.pow(1 - x, 4); }; // easeOutQuart
  var seg = function (t, a, b) { return clamp((t - a) / (b - a)); };

  // headline in/out: blur → sharp, rising, tightening; then out with a soft blur
  function title(el, t, a, b, c, d) {
    var i = out(seg(t, a, b)), o = ease(seg(t, c, d)), v = i * (1 - o);
    el.style.opacity = v;
    el.style.filter = 'blur(' + ((1 - i) * 18 + o * 14) + 'px)';
    el.style.transform = 'translateY(' + ((1 - i) * 40 - o * 30) + 'px) scale(' + (1.04 - .04 * i + o * .02) + ')';
    el.style.letterSpacing = (0.02 - 0.04 * i) + 'em';
  }
  function draw(path, p) { var L = path._L || (path._L = path.getTotalLength()); path.style.strokeDasharray = L; path.style.strokeDashoffset = L * (1 - clamp(p)); }

  // dust: a few slow motes catching light
  var dust = $('dust').getContext('2d'), motes = [];
  for (var i = 0; i < 70; i++) motes.push({ x: Math.random() * 1920, y: Math.random() * 1080, r: Math.random() * 1.6 + .3, v: Math.random() * .25 + .05, a: Math.random() * .5 + .1 });

  var fallW = $('fallW'), fallR = $('fallR'), fallG = $('fallRglow'), riseP = $('riseP'), riseG = $('riseGlow'), tip = $('tip'), cam = $('cam');
  var DUR = 20.5;

  function frame(t) {
    // ---- scene 1: the problem (0–10.5 s) ----
    title($('l1'), t, .6, 1.8, 3.0, 3.6);
    title($('l2'), t, 3.5, 4.6, 6.2, 6.8);
    var n = out(seg(t, 4.9, 5.6)) * (1 - ease(seg(t, 8.6, 9.2)));
    $('note').style.opacity = n; $('note').style.transform = 'translateY(' + (-60 * (1 - out(seg(t, 4.9, 5.6)))) + 'px) scale(' + (.96 + .04 * out(seg(t, 4.9, 5.6))) + ')';

    var cushion = out(seg(t, 6.6, 7.4)) * (1 - ease(seg(t, 13, 13.8)));
    $('cushion').setAttribute('opacity', cushion * .85); $('cushionLab').setAttribute('opacity', cushion * (1 - ease(seg(t, 10.6, 11))));
    var fp = ease(seg(t, 6.8, 10.2));
    [fallW, fallR, fallG].forEach(function (p) { draw(p, fp); });
    title($('l3'), t, 8.9, 9.8, 10.3, 10.7);

    // ---- scene 2: the reveal (10.5–20.5 s) ----
    var rp = out(seg(t, 10.55, 12.3));
    draw(riseP, rp); draw(riseG, rp);
    var fallFade = 1 - ease(seg(t, 12.6, 13.6));
    $('fall').setAttribute('opacity', fallFade); riseP.setAttribute('opacity', 1 - ease(seg(t, 13.2, 14))); riseG.setAttribute('opacity', .8 * (1 - ease(seg(t, 13.2, 14))));
    // the tip of the line, and a camera that chases it
    var showTip = t > 10.55 && t < 13.6;
    if (showTip) { var L = riseP._L || riseP.getTotalLength(), pt = riseP.getPointAtLength(L * rp); tip.setAttribute('cx', pt.x); tip.setAttribute('cy', pt.y); }
    tip.setAttribute('opacity', showTip ? 1 - ease(seg(t, 12.8, 13.6)) : 0);
    var push = ease(seg(t, 10.4, 12.4)) * (1 - ease(seg(t, 12.6, 14)));
    var drift = 1 + .03 * ease(seg(t, 6.6, 10.4));
    cam.setAttribute('transform', 'translate(' + (-300 * push) + ',' + (220 * push) + ') scale(' + (drift + .35 * push) + ')');
    cam.style.transformOrigin = '960px 540px';

    // light comes up with the beat, glass panels sweep past in depth
    $('glow').style.opacity = .15 * ease(seg(t, 6.5, 10)) + .85 * out(seg(t, 10.5, 12)) * (1 - .4 * ease(seg(t, 16, 20)));
    ['p1', 'p2', 'p3', 'p4'].forEach(function (id, k) {
      var a = 11 + k * .25, pv = seg(t, a, a + 3.2), el = $(id);
      el.style.opacity = Math.sin(Math.PI * pv) * .9;
      el.style.transform = 'translate(' + ((k % 2 ? -1 : 1) * 260 * (pv - .5)) + 'px,' + (-120 * (pv - .5)) + 'px) scale(' + (.85 + .3 * pv) + ')';
    });

    // the logo: the badge arrives and its curve draws itself (white → coral → green), then the wordmark settles
    var m = out(seg(t, 13.4, 15));
    $('mark').style.opacity = m; $('mark').style.filter = 'blur(' + (1 - m) * 16 + 'px)';
    $('mark').style.transform = 'scale(' + (1.12 - .12 * m) + ')';
    $('word').style.letterSpacing = (0.32 + 0.5 * (1 - m)) + 'em';
    var lp = ease(seg(t, 13.6, 15.2));
    draw($('logoLine'), lp); draw($('logoGlow'), lp);
    $('logoDot').setAttribute('opacity', out(seg(t, 14.4, 14.8)));
    title($('tag'), t, 15.6, 16.8, 99, 100);

    // dust
    dust.clearRect(0, 0, 1920, 1080);
    var dv = .25 + .75 * ease(seg(t, 10.5, 12));
    motes.forEach(function (p) { p.y -= p.v * (1 + 4 * push); if (p.y < -5) { p.y = 1085; p.x = Math.random() * 1920; } dust.globalAlpha = p.a * dv; dust.fillStyle = '#fff'; dust.beginPath(); dust.arc(p.x, p.y, p.r, 0, 6.283); dust.fill(); });
    $('hud').textContent = t.toFixed(1) + ' s';
  }

  // ---- sound: original, synthesised ----
  var ac = null, muted = false, master = null;
  function audio() {
    if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
  }
  function tone(at, f, dur, type, vol, glideTo) {
    var o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, at);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, at + dur);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(master); o.start(at); o.stop(at + dur + .05);
  }
  function drone(at, dur, f, vol) {
    [f, f * 1.5, f * 2.01].forEach(function (x, k) {
      var o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(); o.type = k ? 'sine' : 'sawtooth'; o.frequency.value = x;
      lp.type = 'lowpass'; lp.frequency.setValueAtTime(300, at); lp.frequency.linearRampToValueAtTime(1400, at + dur * .9);
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol / (k + 1), at + 2.5); g.gain.setValueAtTime(vol / (k + 1), at + dur - .6); g.gain.linearRampToValueAtTime(0, at + dur);
      o.connect(lp); lp.connect(g); g.connect(master); o.start(at); o.stop(at + dur + .1);
    });
  }
  function score(t0) {
    drone(t0 + .2, 10.4, 55, .05);                       // tension under the problem
    tone(t0 + 5.0, 1318, .5, 'sine', .12); tone(t0 + 5.12, 1760, .6, 'sine', .09); // notification
    tone(t0 + 9.6, 220, 1.0, 'sine', .08, 110);          // the drop
    tone(t0 + 10.55, 46, 1.6, 'sine', .9, 30);           // impact at the turn
    tone(t0 + 10.55, 2400, .6, 'triangle', .05, 600);    // glass shimmer
    for (var b = 0; b < 16; b++) { var at = t0 + 10.55 + b * .625; tone(at, 60, .3, 'sine', .45, 38); if (b % 2) tone(at, 7000, .05, 'square', .015); } // pulse at 96 bpm
    drone(t0 + 10.55, 9.8, 110, .045);
    [523, 659, 784, 988].forEach(function (f, k) { tone(t0 + 13.6 + k * .09, f, 2.4, 'sine', .05); }); // the logo chord
  }

  var start = null, raf = 0;
  function play() {
    $('start').style.display = 'none';
    try { audio(); if (ac.state === 'suspended') ac.resume(); master.gain.value = muted ? 0 : .9; score(ac.currentTime); } catch (e) {}
    start = performance.now(); cancelAnimationFrame(raf);
    (function loop(now) { var t = (now - start) / 1000; frame(Math.min(t, DUR)); if (t < DUR + 1) raf = requestAnimationFrame(loop); })(start);
  }
  $('start').addEventListener('click', play);
  addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'r' || e.key === 'R') { e.preventDefault(); if (ac) { try { ac.close(); } catch (x) {} ac = null; } play(); }
    else if (e.key === 'm' || e.key === 'M') { muted = !muted; if (master) master.gain.value = muted ? 0 : .9; }
    else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(function () {}); }
  });
  // ?t=12 freezes a frame (for checking a moment)
  var q = /[?&]t=([\d.]+)/.exec(location.search);
  if (q) { $('start').style.display = 'none'; frame(parseFloat(q[1])); }
  window.__frame = frame;
})();
</script>
</body>
</html>
