<!doctype html>
<!--
  Web page template for the single-page build (app.json → web.output "single"), based on Expo's default.
  Adds Runway's charcoal background and browser theme colour (no white strip behind the phone's status
  bar or on overscroll), stops iOS Safari from inflating text, and lets layout use the safe areas.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14181c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Runway" />
    <meta name="description" content="See the day your balance runs out before it happens — and let an AI banker fix it with one tap." />
    <!-- installable from the Home Screen: on iPhone that's what lets Runway send heads-up alerts -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #14181c;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run Runway. </noscript>
    <div id="root"></div>
  </body>
</html>
