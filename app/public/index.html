<!doctype html>
<!--
  Web page template for the single-page build (app.json → web.output "single"), based on Expo's default.
  Adds Runway's charcoal background and browser theme colour (no white strip behind the phone's status
  bar or on overscroll), stops iOS Safari from inflating text, and lets layout use the safe areas.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1215" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Runway" />
    <meta name="description" content="See the day your balance runs out before it happens — and let an AI banker fix it with one tap." />
    <!-- installable from the Home Screen: on iPhone that's what lets Runway send heads-up alerts -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #0f1215;
        color-scheme: dark;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f2f3f5;
        color-scheme: light;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Light or dark before the first paint (the saved choice, else the device's), so a light-mode
         visitor never sees a dark flash. src/lib/theme.ts takes over once the app loads. -->
    <script>
      (function () {
        var c = null;
        try { c = localStorage.getItem('runway.appearance'); } catch (e) {}
        var light = c === 'light' || (c !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2f3f5');
      })();
    </script>
    <!-- Desktop scale: the screens are sized for phones, so in a wide window the whole page (menus and
         sheets too) is enlarged evenly: 1.1x at 1440px wide, up to 1.25x. Phones and narrow windows stay
         at 1x. Runs before the app paints; src/lib/zoom.ts reads it back where screen positions matter. -->
    <script>
      (function () {
        function fit() {
          var k = window.innerWidth >= 1300 ? Math.min(1.25, window.innerWidth / 1300) : 1;
          document.body.style.zoom = String(k);
        }
        document.addEventListener('DOMContentLoaded', fit);
        window.addEventListener('resize', fit);
      })();
    </script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run Runway. </noscript>
    <div id="root"></div>
  </body>
</html>
