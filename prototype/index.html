/* KPI strip — real income, spent, net, refunds */
function kpiStrip(ym){
  const st = monthTxnStats(ym), inc = monthIncome(ym), net = inc - st.spent;
  const cards = [
    ['Real income', inc,  'green', 'paychecks landing this month'],
    ['Spent',       st.spent, 'red', `${st.count} card transaction${st.count===1?'':'s'} imported`],
    ['Net',         net,  net>=0?'green':'red', 'income − card spend'],
    ['Refunds in',  st.refunds, 'blue', 'credits & reversals'],
  ];
  return `<div class="kpis">${cards.map(([label,v,cls,sub])=>`
    <div class="kpi">
      <div class="stat-label">${label}</div>
      <div class="kpi-v ${cls}">${fmt(v)}</div>
      <div class="kpi-sub">${sub}</div>
    </div>`).join('')}</div>`;
}

/* donut of one month's spend by category */
function spendDonut(ym){
  const rows = catBreakdown(ym);
  const total = rows.reduce((s,r)=>s+r[1],0);
  if(!total) return `<div class="card"><h2>🍩 Spending by category</h2>
    <div class="note">No transactions imported for ${MONTH_FULL(ym)} yet. Use <b>Import CSV</b> above.</div></div>`;
  const R=70, C=2*Math.PI*R; let off=C*0.25;
  const circles = rows.map(([c,amt])=>{
    const len = amt/total*C;
    const s = `<circle class="seg" r="${R}" cx="95" cy="95" fill="none" stroke="${colorOf(c)}" stroke-width="22"
      stroke-dasharray="${Math.max(0,len-2)} ${C-len+2}" stroke-dashoffset="${off}" stroke-linecap="butt"><title>${c}: ${fmt(amt)}</title></circle>`;
    off -= len; return s;
  }).join('');
  const legend = rows.map(([c,amt])=>`<div class="debt-row">
    <span><span style="background:${colorOf(c)}; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:8px"></span>${c}</span>
    <span class="num">${fmt(amt)} <span class="dim" style="font-size:11px">${(amt/total*100).toFixed(0)}%</span></span></div>`).join('');
  return `<div class="card"><h2>🍩 Spending by category — ${MONTH_FULL(ym)}</h2>
    <div class="donut-wrap">
      <svg width="190" height="190" viewBox="0 0 190 190">${circles}
        <text x="95" y="90" text-anchor="middle" fill="#eef3f8" font-size="19" font-weight="800">${fmt0(total)}</text>
        <text x="95" y="110" text-anchor="middle" fill="#8b9aa8" font-size="11">spent</text></svg>
      <div class="dlegend">${legend}</div>
    </div></div>`;
}

/* "Transfers to make" — driven by the plan's own unchecked events for this month, not a static list */
function transfersCard(ym){
  const evs = buildEvents().filter(e => e.date.slice(0,7) === ym && e.amount < 0 && !e.minor && !e.sweep);
  const rows = evs.map(e => {
    const done = !!checked[e.id];
    return `<div class="action-item" style="${done?'opacity:.45':''}">
      <div style="display:flex; gap:11px; align-items:flex-start">
        <input type="checkbox" ${done?'checked':''} onchange="toggleCheck('${e.id.replace(/'/g,"\\'")}', this)" style="margin-top:3px">
        <div><b style="${done?'text-decoration:line-through':''}">${e.label}</b>
          <div class="when">${niceDate(e.date)}</div></div>
      </div>
      <span class="num ${done?'dim':''}">${fmt(-e.amount)}</span>
    </div>`;
  }).join('');
  const left = evs.filter(e=>!checked[e.id]).reduce((s,e)=>s+(-e.amount),0);
  return `<div class="card">
    <h2>➡️ Transfers to make — ${MONTH_FULL(ym)}</h2>
    ${rows || '<div class="note">Nothing scheduled this month.</div>'}
    <div class="note">Still to pay this month: <b class="amber">${fmt(left)}</b>. Ticking one here also clears it from Today and recomputes your debt totals.</div>
  </div>`;
}

/* full transaction list for the month */
function txnListCard(ym){
  const list = txns.filter(t => t.d.slice(0,7) === ym).sort((a,b)=> b.d.localeCompare(a.d));
  if(!list.length) return `<div class="card"><h2>🧾 Transactions</h2><div class="note">Nothing imported for ${MONTH_FULL(ym)}.</div></div>`;
  const rows = list.map(t => {
    const c = catOf(t);
    const kind = t.t === 'payment' ? '<span class="pill ok">payment</span>'
               : t.a < 0 ? '<span class="pill ok">credit</span>' : '';
    return `<tr>
      <td class="dim" style="white-space:nowrap">${niceDate(t.d)}</td>
      <td>${t.m} ${kind}</td>
      <td><span style="background:${colorOf(c)}; display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px"></span><span class="dim">${c}</span></td>
      <td class="num ${t.t==='payment'||t.a<0 ? 'green':''}" style="text-align:right; white-space:nowrap">${t.t==='payment'? '−'+fmt(-t.a).replace('-','') : fmt(t.a)}</td>
    </tr>`;
  }).join('');
  const st = monthTxnStats(ym);
  return `<div class="card">
    <h2>🧾 Transactions — ${MONTH_FULL(ym)} · ${list.length} rows</h2>
    <div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="note">Purchases ${fmt(st.spent)} · card payments made ${fmt(st.payments)} (transfers, not spending) · credits ${fmt(st.refunds)}</div>
  </div>`;
}

/* month vs month — spend by category, stacked */
function monthVsMonthCard(){
  const ms = txnMonths();
  if(ms.length < 2) return `<div class="card"><h2>📊 Month vs month</h2>
    <div class="note">Import a second month of transactions to unlock this comparison. Right now only ${ms.map(MONTH_FULL).join(', ') || 'nothing'} is loaded.</div></div>`;
  const cats = [...new Set(txns.filter(t=>t.t!=='payment'&&t.a>0).map(catOf))];
  const rows   = ms.map(ym => ({key:ym, label:MONTH_SHORT(ym)}));
  const series = cats.map(c => ({key:c, label:c, color:colorOf(c)}));
  const cache  = Object.fromEntries(ms.map(ym => [ym, Object.fromEntries(catBreakdown(ym))]));
  const svg = barChart(rows, series, (r,k) => cache[r.key][k] || 0, {stacked:true});
  const totals = ms.map(ym => monthTxnStats(ym).spent);
  const delta = totals[totals.length-1] - totals[totals.length-2];
  return `<div class="card"><h2>📊 Month vs month — total spend</h2>${svg}
    <div class="note">${MONTH_FULL(ms[ms.length-1])} is <b class="${delta>=0?'red':'green'}">${delta>=0?'up':'down'} ${fmt(Math.abs(delta))}</b> vs the month before.</div></div>`;
}

/* budget — what you actually spend vs the dials in Settings */
function budgetVsActualCard(ym){
  const b = Object.fromEntries(catBreakdown(ym));
  const groceriesBudget = Math.round(settings.weeklySpend*52/12*100)/100;
  const lines = [
    ['Groceries',        b['Groceries']||0,     groceriesBudget,     'weekly groceries dial × 52 ÷ 12'],
    ['Dining',           b['Dining']||0,        settings.funMonthly, 'shares the Discretionary dial'],
    ['Gas',              b['Gas']||0,           0, 'not budgeted'],
    ['Shopping + Other', (b['Shopping']||0)+(b['Other']||0), 0, 'not budgeted'],
    ['Entertainment',    b['Entertainment']||0, 0, 'not budgeted'],
  ];
  const rows = lines.map(([name, actual, budget, note])=>{
    const over = budget > 0 && actual > budget;
    const pct = budget > 0 ? Math.min(100, actual/budget*100) : (actual>0?100:0);
    const color = budget === 0 ? (actual>0?'var(--amber)':'var(--green)') : over ? 'var(--red)' : 'var(--green)';
    return `<div style="margin-bottom:14px">
      <div class="debt-row" style="border:none; padding-bottom:4px">
        <span>${name} <span class="dim" style="font-size:11px">${note}</span></span>
        <span class="num">${fmt(actual)} <span class="dim">/ ${budget>0?fmt(budget):'no budget'}</span></span>
      </div>
      <div class="bar"><div style="width:${pct}%; height:100%; background:${color}; border-radius:99px"></div></div>
    </div>`;
  }).join('');
  const totalActual = lines.reduce((s,l)=>s+l[1],0);
  const totalBudget = lines.reduce((s,l)=>s+l[2],0);
  return `<div class="card"><h2>🎯 Budget vs actual — ${MONTH_FULL(ym)}</h2>${rows}
    <div class="note">Tracked spend <b>${fmt(totalActual)}</b> against <b>${fmt(totalBudget)}</b> of budgeted dials —
    a <b class="${totalActual>totalBudget?'red':'green'}">${fmt(Math.abs(totalActual-totalBudget))} ${totalActual>totalBudget?'over':'under'}</b>.
    The dials live in Plan → Settings. Categories showing "no budget" are real spending your projection assumes is $0.</div></div>`;
}

/* insights — things the numbers say that you would not spot by eye */
function insightsCard(ym){
  const b = Object.fromEntries(catBreakdown(ym));
  const st = monthTxnStats(ym);
  const list = txns.filter(t => t.d.slice(0,7)===ym && t.t!=='payment' && t.a>0);
  const biggest = list.slice().sort((a,b)=>b.a-a.a).slice(0,5);
  const dining = list.filter(t => catOf(t)==='Dining');
  const groceriesBudget = Math.round(settings.weeklySpend*52/12*100)/100;
  const out = [];

  // a note on the month means you already know why it looked odd — say it first, and stop the
  // habit-flags below from calling a known one-off a trend.
  const note = monthNotes[ym];
  if(note) out.push(['ok', `📌 Your note on ${MONTH_FULL(ym)}`, note]);

  if(dining.length){
    const avg = dining.reduce((s,t)=>s+t.a,0)/dining.length;
    const over = (b['Dining']||0) > (settings.funMonthly||0);
    out.push([ over && !note ? 'bad' : over ? 'warn' : 'ok',
      `Eating out: ${fmt(b['Dining']||0)} across ${dining.length} visits`,
      `That averages ${fmt(avg)} a stop — dining alone is ${((b['Dining']||0)/(settings.funMonthly||1)*100).toFixed(0)}% of your
       ${fmt0(settings.funMonthly)}/mo Discretionary dial, and groceries were only ${fmt(b['Groceries']||0)}.` +
      (note ? ` <b class="green">You have logged a reason for this month, so it is not being counted as a trend.</b>
               Worth re-checking once you have a normal month to compare against.` : '')]);
  }
  // only call it a habit once there is more than one month of evidence — one bad month is an event, not a pattern
  const otherMonths = txnMonths().filter(m => m !== ym && monthTxnStats(m).count >= 8);
  if(!note && otherMonths.length && (b['Groceries']||0) < groceriesBudget*0.7 && (b['Dining']||0) > (b['Groceries']||0)){
    out.push(['bad', 'You are buying restaurants instead of groceries',
      `Groceries ${fmt(b['Groceries']||0)} vs dining ${fmt(b['Dining']||0)}. Cooking the same calories runs roughly a third of the price —
       this is worth about ${fmt0((b['Dining']||0)*0.6)}/mo against a ${fmt0(settings.emergencyTarget)} cushion goal.`]);
  }
  if(biggest.length){
    out.push(['ok', 'Your five biggest charges this month',
      biggest.map(t => `${t.m} — <b>${fmt(t.a)}</b>`).join(' · ') +
      `. Together ${fmt(biggest.reduce((s,t)=>s+t.a,0))}, or ${(biggest.reduce((s,t)=>s+t.a,0)/st.spent*100).toFixed(0)}% of everything you spent.`]);
  }
  if(st.payments > 0){
    out.push(['ok', `You paid ${fmt(st.payments)} into your cards this month`,
      `That is why the balances dropped even while charges kept coming. Paying statements in full is the single best habit in this whole dashboard — keep it.`]);
  }
  if(!out.length) out.push(['ok','Nothing to flag yet','Import a month of transactions and this fills in.']);

  return `<div class="card"><h2>💡 Insights — ${MONTH_FULL(ym)}</h2>
    ${out.map(([sev,title,body])=>`<div class="action-item" style="display:block">
      <b class="${sev==='bad'?'red':sev==='warn'?'amber':'green'}">${title}</b>
      <div class="when" style="margin-top:4px; line-height:1.5">${body}</div>
    </div>`).join('')}</div>`;
}

/* the whole tab */
function spendingSection(){
  const ms = txnMonths(), ym = activeMonth();
  const chips = ms.map(m => `<button class="mchip ${m===ym?'on':''}" onclick="setSpendMonth('${m}')">${MONTH_SHORT(m)}</button>`).join('');
  const views = [['overview','Overview'],['txns','Transactions'],['mvm','Month vs Month'],['budget','Budget'],['insights','Insights']];
  const tabs = views.map(([k,l]) => `<button class="vtab ${spendView===k?'on':''}" onclick="setSpendView('${k}')">${l}</button>`).join('');
  let body = '';
  if(spendView === 'overview')      body = kpiStrip(ym) + `<div class="two-col">${spendDonut(ym)}${transfersCard(ym)}</div>`;
  else if(spendView === 'txns')     body = txnListCard(ym);
  else if(spendView === 'mvm')      body = monthVsMonthCard();
  else if(spendView === 'budget')   body = budgetVsActualCard(ym);
  else                              body = insightsCard(ym);
  return `
    <div class="vtabs">${tabs}</div>
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px">
      <div class="mchips">${chips || '<span class="dim">no months loaded</span>'}</div>
      <div class="row" style="gap:8px">
        <button onclick="pickTxnCSV()">Import CSV</button>
        <button class="ghost" onclick="noteMonth()">${monthNotes[ym] ? 'Edit note' : 'Why was this month odd?'}</button>
        <button class="ghost" onclick="clearTxns()">Clear</button>
      </div>
    </div>
    ${monthNotes[ym] ? `<div class="note" style="margin:0 0 16px; padding:12px 15px; background:var(--card2);
      border:1px solid var(--line); border-radius:12px">📌 ${monthNotes[ym]}</div>` : ''}
    ${body}`;
}

/* ================= page tabs ================= */
// 4 tabs, each showing a group of the underlying sections
const TAB_SECTIONS = {
  home:  ['home'],
  goals: ['house'],
  spending: ['spending'],
  log:   ['spend','ious'],
  plan:  ['charts','plan','settings'],
};
let currentPage = 'home';
function applyPage(){
  const ids = TAB_SECTIONS[currentPage] || [currentPage];
  document.querySelectorAll('#app > section').forEach(s => s.classList.toggle('active', ids.includes(s.id)));
  document.querySelectorAll('nav a[data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === currentPage));
}
window.showPage = (id) => { currentPage = id; applyPage(); window.scrollTo({top:0, behavior:'smooth'}); };

/* ================= lock / unlock ================= */
function openApp(){ sessionStart = true; document.body.classList.remove('locked'); initState(); render(); }

window.lockSubmit = async () => {
  const pw = $('#pw').value, msg = $('#lockMsg');
  if(pw.length < 4){ msg.textContent = 'Use at least 4 characters.'; return; }
  msg.textContent = 'Unlocking…';
  try{
    syncId = await deriveSyncId(pw);
    const local = localStorage.getItem('pb_vault');
    if(local){
      await unlockVaultStr(pw, local);
      openApp();
      // reconcile with cloud in the background — newest wins
      const remote = await remoteGet();
      const lts = (JSON.parse(local).ts || 0);
      const rts = remote ? (JSON.parse(remote).ts || 0) : 0;
      if(remote && rts > lts){
        try{ await unlockVaultStr(pw, remote); localStorage.setItem('pb_vault', remote); initState(); render(); toast('Pulled latest from your other device ☁️'); }catch(e){}
      } else if(!remote || lts > rts){
        remotePut(local);
      }
    } else {
      const remote = await remoteGet();
      if(remote){
        await unlockVaultStr(pw, remote);   // throws if password wrong
        localStorage.setItem('pb_vault', remote);
        openApp(); toast('Synced from your other device ☁️');
      } else {
        if(pw !== $('#pw2').value){ msg.textContent = "Passwords don't match (or typo'd an existing password — retype both)."; return; }
        await createVault(pw);
        openApp();
      }
    }
  }catch(e){
    msg.textContent = 'Wrong password.';
    $('#pw').value = '';
    const box = document.querySelector('.lockbox');
    box.classList.add('shake'); setTimeout(()=> box.classList.remove('shake'), 450);
  }
};
window.lockNow = () => location.reload();
window.setEmergency = v => {
  emergency = Math.max(0, Math.round((Number(v)||0)*100)/100);
  save('emergency', emergency); render(); toast('Emergency fund updated');
};
// Download the ENCRYPTED vault as a file — safe to store anywhere (needs your password to open).
// This is your disaster-recovery against account loss or a forgotten device.
window.exportVault = () => {
  const v = localStorage.getItem('pb_vault');
  if(!v) return toast('Nothing saved yet');
  try{
    const url = URL.createObjectURL(new Blob([v], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'personal-banker-backup-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    toast('Encrypted backup downloaded — keep it somewhere safe ☁️');
  }catch(e){
    try{ navigator.clipboard.writeText(v); toast('Download blocked — copied to clipboard instead'); }
    catch(_){ prompt('Copy this encrypted backup:', v); }
  }
};
window.importVault = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if(!f) return;
    const r = new FileReader(); r.onload = () => applyImport(String(r.result)); r.readAsText(f); };
  inp.click();
};
function applyImport(v){
  try{
    const o = JSON.parse(v);
    if(!o.salt || !o.iv || !o.ct) throw 0;
    if(!confirm('Restore this backup? It replaces the data on this device — you\'ll unlock it with the password it was created with.')) return;
    localStorage.setItem('pb_vault', v);
    toast('Imported — unlocking with its password…');
    setTimeout(()=> location.reload(), 900);
  }catch(e){ toast('That doesn\'t look like a valid backup file'); }
}
window.wipeAll = () => {
  if(confirm('This permanently erases ALL saved data (checkmarks, synced balances, goal deposits). The plan itself stays. Continue?')){
    localStorage.removeItem('pb_vault');
    legacyKeys().forEach(k => localStorage.removeItem(k));
    location.reload();
  }
};

function boot(){
  if(!CAN_CRYPT){ document.body.classList.remove('locked'); initState(); render(); return; }
  const hasVault = !!localStorage.getItem('pb_vault');
  $('#lockTitle').textContent = hasVault ? '🔒 Unlock your finances' : '🔐 Set a password';
  $('#lockSub').textContent = hasVault
    ? 'Your data is encrypted. Enter your password.'
    : 'Enter your password. If you already use this app on another device, the SAME password pulls your data from the cloud. New here: choose one — it encrypts everything, and there is NO recovery if you forget it.';
  $('#pw2').style.display = hasVault ? 'none' : '';
  $('#lockForget').style.display = hasVault ? '' : 'none';
  $('#lockMsg').textContent = '';
  for(const id of ['#pw','#pw2']) $(id).addEventListener('keydown', e => { if(e.key==='Enter') lockSubmit(); });
  $('#pw').focus();
}
boot();
</script>
