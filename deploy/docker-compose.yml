# Production stack on the Vultr server, run from /opt/runway/deploy:
#   docker compose --env-file ../.env up -d --build
# Secrets live only in /opt/runway/.env on the server (never in git).
services:
  api:
    build: ../backend
    env_file: ../.env
    environment:
      ROOT_PATH: /api
      # which Auth0 login sees which demo persona — user ids aren't secret, so they come from the
      # GitHub repo variable AUTH0_PERSONAS at deploy time (falls back to ../.env)
      AUTH0_PERSONAS: ${AUTH0_PERSONAS:-}
      # the same tenant + API identifier the website's sign-in asks Auth0 for (repo variables), so a
      # token the site gets is always one the API accepts
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      # Auth0 push approvals (CIBA): over-limit bridges buzz the lender's phone through Auth0 Guardian.
      # The client id and persona → user map are repo variables; the secret (a GitHub Actions secret)
      # is written into ../.env by the deploy and read from there via env_file — not listed here, or
      # an empty value would override it. Off until all three exist: over-limit bridges then use the
      # in-app approval card.
      AUTH0_CIBA_CLIENT_ID: ${AUTH0_CIBA_CLIENT_ID:-}
      AUTH0_CIBA_USERS: ${AUTH0_CIBA_USERS:-}
      # "1" = Fix it, P2P and the safety net move real Nessie money (signed-in owners only);
      # from the GitHub repo variable LIVE_TRANSFERS at deploy time
      LIVE_TRANSFERS: ${LIVE_TRANSFERS:-}
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" serves plain HTTP on the server IP; set to your domain for automatic HTTPS
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
